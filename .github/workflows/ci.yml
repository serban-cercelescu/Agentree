# Tests, typecheck and both production builds on every push and pull
# request, on the three supported platforms and on the oldest Node the
# extension runs on (VS Code 1.101's bundled Node 22.15) as well as a current
# one. Then the extension is packaged as it would be released.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks first.
  workflow_call:

permissions:
  contents: read

concurrency:
  # The workflow's name is the caller's when Release runs these checks, so
  # a release never waits on, or cancels, the branch's own CI run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nothing here starts Electron; skip its ~100 MB binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  # The update check never runs in CI, but make sure.
  AGENTREE_NO_UPDATE_CHECK: "1"

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.15.0", "24"]
        # One macOS job: GitHub's macOS runners are scarce (a second job
        # queued for 15 minutes and was never picked up), and the Node floor
        # is covered on Ubuntu and Windows.
        exclude:
          - os: macos-latest
            node: "22.15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `prepare` runs `npm run build` (renderer, Electron host, preload, worker).
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:vscode

  docs:
    name: Docs and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Relative Markdown links and anchors
        run: node scripts/check-links.mjs
      - name: One version everywhere
        run: node scripts/check-version.mjs
      - name: Whitespace errors in the change
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

  package:
    name: Package the extension
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:vscode
      - name: vsce package
        working-directory: vscode-ext
        run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentree-vsix
          path: vscode-ext/*.vsix
          if-no-files-found: error
          retention-days: 14

  # One stable check for main's ruleset to require, whatever the matrix
  # becomes (docs/upstream.md, "Repository rules").
  passed:
    name: CI passed
    if: always()
    needs: [check, docs, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
